name: Publicar rama develop en sitio de pruebas

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: publicar-pruebas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar Pages con main y la vista de pruebas de develop
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main'
            });
