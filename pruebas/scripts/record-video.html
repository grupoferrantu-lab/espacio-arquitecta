<!doctype html><html lang="es"><meta charset="utf-8"><title>Generador de video conceptual</title><body><h1>Recurso audiovisual de demostración</h1><p>Herramienta local de desarrollo. Genera una animación original sin audio ni datos personales.</p><canvas width="800" height="450" style="width:600px;max-width:100%"></canvas><p><button id="record">Generar video</button></p><p id="status" role="status"></p><a id="download" hidden download="espacio-demo.webm">Descargar video</a><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),status=document.querySelector('#status');
function draw(t){ctx.fillStyle='#e8dfcf';ctx.fillRect(0,0,800,450);ctx.strokeStyle='#7b3730';ctx.lineWidth=3;for(let i=0;i<5;i++){const x=400+i*54;ctx.beginPath();ctx.moveTo(x,390);ctx.lineTo(x,180-i*12);ctx.arc(x+65,180-i*12,65,Math.PI,0);ctx.lineTo(x+130,390);ctx.stroke();}ctx.fillStyle='#302e29';ctx.font='38px Georgia';ctx.fillText('espacio',55,160);ctx.fillText('arquitecta.',55,207);ctx.font='17px Arial';ctx.fillText('Conectar miradas.',55,260);ctx.fillText('Construir posibilidades.',55,288);ctx.font='11px Arial';ctx.fillText('ANIMACIÓN CONCEPTUAL · DEMOSTRACIÓN',55,407);ctx.fillStyle='#7b3730';ctx.fillRect(55,330,Math.min(270,t*54),3);}
draw(0);document.querySelector('#record').onclick=()=>{if(!c.captureStream||!window.MediaRecorder){status.textContent='Este navegador no admite la generación WebM.';return;}document.querySelector('#record').disabled=true;const stream=c.captureStream(24),chunks=[],mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));const r=new MediaRecorder(stream,{mimeType:mime});r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};r.onstop=()=>{const a=document.querySelector('#download');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.hidden=false;status.textContent='Video listo para descargar.';stream.getTracks().forEach(t=>t.stop());};r.start();status.textContent='Generando video de 5 segundos…';const start=performance.now();function tick(){const t=(performance.now()-start)/1000;draw(t);if(t<5)requestAnimationFrame(tick);else r.stop();}tick();};
</script></body></html>
